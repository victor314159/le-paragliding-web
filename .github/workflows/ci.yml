name: CI

on:
  push:
    branches: [main]
    # npm release of packages/engine (release job): engine-v<version>.
    tags: ['engine-v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build (WASM, oracle check, lint, Angular)
        run: docker build --output dist .
      - name: Browser tests
        run: docker compose run --rm web sh -c 'npm ci && npm test'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Requires Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Publishes packages/engine to npm through trusted publishing (OIDC, no
  # token): requires the trusted publisher set on npmjs.com for this workflow.
  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/engine/package.json').version")
          [ "$GITHUB_REF_NAME" = "engine-v$VERSION" ] \
            || { echo "tag $GITHUB_REF_NAME, package version $VERSION"; exit 1; }
      - name: Build, oracle check, pack and check the package
        run: docker build --target engine-pkg --output pkg .
      - run: npm publish pkg/*.tgz --access public
