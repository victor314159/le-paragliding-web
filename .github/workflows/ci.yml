name: CI

on:
  push:
    branches: [main]
    # Releases, pushed by scripts/bump.ts: web-v<version> deploys GitHub Pages
    # (deploy job), engine-v<version> publishes packages/engine to npm
    # (release job). Pushes to main only build and test.
    tags: ['web-v*', 'engine-v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # A bump pushes main and its tag together: the tag run builds the same commit.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Bump ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Not the default builder: docker compose below keeps the plain one.
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false
      # The GitHub Actions cache skips the WASM compile and the oracle check
      # when the engine has not changed.
      - name: Build (WASM, oracle check, lint, Angular)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Browser tests
        run: docker compose run --rm web sh -c 'npm ci && npm test'
      # @lepara/format against the native engine (gfortran); the browser
      # tests check it against the WASM one.
      - name: Input format, native engine
        run: docker compose run --rm oracle node scripts/check-format-native.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Requires Settings > Pages > Source: GitHub Actions, and web-v* tags allowed
  # in Settings > Environments > github-pages.
  deploy:
    if: startsWith(github.ref, 'refs/tags/web-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Publishes packages/engine to npm through trusted publishing (OIDC, no
  # token): requires the trusted publisher set on npmjs.com for this workflow.
  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/engine/package.json').version")
          [ "$GITHUB_REF_NAME" = "engine-v$VERSION" ] \
            || { echo "tag $GITHUB_REF_NAME, package version $VERSION"; exit 1; }
      - id: buildx
        uses: docker/setup-buildx-action@v4
      # Reuses the build job's cache: the WASM is not compiled again.
      - name: Build, oracle check, pack and check the package
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: engine-pkg
          outputs: type=local,dest=pkg
          cache-from: type=gha
      - run: npm publish ./pkg/*.tgz --access public
