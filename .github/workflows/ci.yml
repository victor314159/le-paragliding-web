name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run of main at a time: a run sees the tags of the releases before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.unreleased.outputs.web }}
      engine: ${{ steps.unreleased.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
      # Releases, bumped by scripts/bump.ts: a version of main without its tag
      # (web-v<version>, engine-v<version>) is deployed or published, then
      # tagged, once every check passed.
      - id: unreleased
        if: github.event_name == 'push'
        run: |
          tags=$(git ls-remote --tags origin)
          for target in web engine; do
            file=$([ $target = web ] && echo package.json || echo packages/engine/package.json)
            version=$(node -p "require('./$file').version")
            grep -q "refs/tags/$target-v$version$" <<< "$tags" || echo "$target=$version" >> "$GITHUB_OUTPUT"
          done
      # Not the default builder: docker compose below keeps the plain one.
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false
      # The site (dist/) and the npm package (pkg/) of one build. No cache:
      # writing it took longer than compiling the WASM and checking it again.
      - name: Build (WASM, oracle check, lint, Angular, package)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: release
          outputs: type=local,dest=.
      # One worker per core of the runner (Playwright defaults to half).
      - name: Browser tests
        run: docker compose run --rm -e ORACLE_ALL=1 web sh -c 'npm ci && npm test -- --workers=4'
      - if: steps.unreleased.outputs.web
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - if: steps.unreleased.outputs.engine
        uses: actions/upload-artifact@v7
        with:
          name: engine-package
          path: pkg

  # The native Fortran checks, beside the build: they need neither dist/ nor the WASM.
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The patched source on the official toolchain: only the pinned patch effects.
      - name: Patched engine, native
        run: docker compose run --rm oracle node scripts/check-patched-native.ts
      # @lepara/format against the native engine; the browser tests check it
      # against the WASM one.
      - name: Input format, native engine
        run: docker compose run --rm oracle node scripts/check-format-native.ts
      - name: Geometry preprocessor, native oracle
        run: docker compose run --rm oracle node scripts/check-preprocessor-native.ts

  # Requires Settings > Pages > Source: GitHub Actions, and main allowed in
  # Settings > Environments > github-pages.
  deploy:
    if: needs.build.outputs.web
    needs: [build, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: deploy
        uses: actions/deploy-pages@v5
      - run: git tag "$TAG" && git push origin "$TAG"
        env:
          TAG: web-v${{ needs.build.outputs.web }}

  # Publishes packages/engine to npm through trusted publishing (OIDC, no
  # token): requires the trusted publisher set on npmjs.com for this workflow.
  release:
    if: needs.build.outputs.engine
    needs: [build, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: engine-package
          path: pkg
      - run: npm publish ./pkg/*.tgz --access public
      - run: git tag "$TAG" && git push origin "$TAG"
        env:
          TAG: engine-v${{ needs.build.outputs.engine }}
