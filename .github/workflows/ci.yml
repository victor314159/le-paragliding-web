name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build (WASM, oracle check, lint, Angular)
        run: docker build --output dist .
      - name: Browser tests
        run: docker compose run --rm web sh -c 'npm ci && npm test'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Requires Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
