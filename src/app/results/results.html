<mat-card appearance="outlined">
  <mat-card-header>
    <h2 mat-card-title id="results-title">Generated files</h2>
    <p mat-card-subtitle data-testid="result-meta">
      {{ files().length }} files · computed in {{ compute.computeMs() / 1000 | number: '1.1-1' }} s
    </p>
    <button matButton="outlined" type="button" [disabled]="zipping()" (click)="downloadZip()">
      <mat-icon svgIcon="download" />
      {{ zipping() ? 'Zipping…' : 'Download all (.zip)' }}
    </button>
  </mat-card-header>

  <mat-card-content>
    <table
      mat-table
      [dataSource]="files()"
      [trackBy]="trackByName"
      aria-labelledby="results-title"
      data-testid="result-files"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>File</th>
        <td mat-cell *matCellDef="let file">
          <div class="file">
            <mat-icon
              class="mat-text-on-surface-variant"
              [svgIcon]="file.icon"
              [matTooltip]="file.label"
            />
            <div>
              <div class="mat-font-title-sm">{{ file.name }}</div>
              <div class="mat-font-body-sm mat-text-on-surface-variant">
                {{ file.size | byteSize }} · {{ file.description }}
              </div>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="end">Actions</th>
        <td mat-cell *matCellDef="let file" class="end actions">
          <button
            matIconButton
            type="button"
            matTooltip="Preview"
            [attr.aria-label]="'Preview ' + file.name"
            (click)="preview(file)"
          >
            <mat-icon svgIcon="visibility" />
          </button>
          <a
            matIconButton
            matTooltip="Download"
            [href]="file.url"
            [download]="file.name"
            [attr.aria-label]="'Download ' + file.name"
          >
            <mat-icon svgIcon="download" />
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content>
</mat-card>
