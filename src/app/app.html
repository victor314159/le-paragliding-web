<header app-masthead></header>

<main>
  <app-intro />

  <div class="workspace">
    <app-design-input #input>
      <app-compute-controls />
    </app-design-input>
    @defer (on immediate) {
      <app-wing-preview (expand)="input.editParameters(undefined, true)" />
    }
  </div>

  <!-- Results load in their own chunk, fetched while the browser is idle. -->
  @defer (when compute.status() === 'done'; prefetch on idle) {
    @if (compute.status() === 'done') {
      <app-results />
    }
  }
</main>

<footer app-footer></footer>
