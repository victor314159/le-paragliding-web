<details [open]="expanded()" (toggle)="expanded.set($any($event.target).open)">
  <summary class="mat-font-body-sm mat-text-on-surface-variant">
    Show log · {{ compute.logs().length }} lines
  </summary>
  <div
    #terminal
    class="terminal mat-corner-sm"
    role="log"
    aria-label="Live computation log"
    tabindex="0"
    (scroll)="onScroll()"
  >
    @for (entry of compute.logs(); track $index) {
      <div
        class="line"
        data-testid="log-line"
        [class.stderr]="entry.stream === 'stderr'"
        [textContent]="entry.text"
      ></div>
    } @empty {
      {{
        compute.busy() ? 'Preparing the calculation…' : 'Engine output will appear here as it runs.'
      }}
    }
  </div>
</details>
